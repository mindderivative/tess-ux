name: Vault checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint the vault
        run: python3 tools/lint_vault.py .
      - name: Check the contrast ratios
        run: python3 tools/contrast_check.py .
      - name: Check that the defaults matrix is current
        run: python3 tools/defaults_matrix.py . --check
      - name: Check that the deviations register is current
        run: python3 tools/gen_deviations.py . --check
